# ===== pagos-service =====
spring.application.name=pagos-service
server.port=8086

# ----- Base de datos H2 en archivo (una por servicio) -----
spring.datasource.url=jdbc:h2:file:./data/pagos-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola H2: http://localhost:8086/h2-console  (JDBC URL: jdbc:h2:file:./data/pagos-db)
spring.h2.console.enabled=true

# ----- Para cambiar a MySQL: comenta las líneas de H2 de arriba, agrega la dependencia
# ----- mysql-connector-j al pom.xml y descomenta estas líneas -----
#spring.datasource.url=jdbc:mysql://localhost:3306/pagos_db?createDatabaseIfNotExist=true
#spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=tu_clave
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ----- Swagger: http://localhost:8086/swagger-ui.html -----
springdoc.swagger-ui.path=/swagger-ui.html

# ----- URLs de los otros servicios (los usan los clientes Feign) -----
servicios.pedidos.url=http://localhost:8085

# ----- Timeouts de Feign: 5 segundos para conectar y 5 para leer la respuesta -----
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
