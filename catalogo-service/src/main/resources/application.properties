# ===== catalogo-service =====
spring.application.name=catalogo-service
server.port=8082

# ----- Base de datos H2 en archivo (una por servicio) -----
spring.datasource.url=jdbc:h2:file:./data/catalogo-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola H2: http://localhost:8082/h2-console  (JDBC URL: jdbc:h2:file:./data/catalogo-db)
spring.h2.console.enabled=true

# ----- Para cambiar a MySQL: comenta las líneas de H2 de arriba, agrega la dependencia
