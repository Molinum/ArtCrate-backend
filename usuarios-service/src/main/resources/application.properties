# ===== usuarios-service =====
spring.application.name=usuarios-service
server.port=8081

# ----- Base de datos H2 en archivo (una por servicio) -----
spring.datasource.url=jdbc:h2:file:./data/usuarios-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola H2: http://localhost:8081/h2-console  (JDBC URL: jdbc:h2:file:./data/usuarios-db)
spring.h2.console.enabled=true

# ----- Para cambiar a MySQL: comenta las líneas de H2 de arriba, agrega la dependencia
# ----- mysql-connector-j al pom.xml y descomenta estas líneas -----
#spring.datasource.url=jdbc:mysql://localhost:3306/usuarios_db?createDatabaseIfNotExist=true
#spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=tu_clave
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ----- Swagger: http://localhost:8081/swagger-ui.html -----
springdoc.swagger-ui.path=/swagger-ui.html

# ----- Eureka: el servicio se registra aquí para que los demás lo encuentren por su nombre -----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Se registra como "localhost": todos los servicios corren en la misma máquina, así que funciona
# siempre, sin depender del nombre del equipo (hostname) ni de la red a la que estés conectado.
eureka.instance.hostname=localhost
# Ajustes de desarrollo (más rápidos que los valores por defecto):
# registrarse a los 5 s de arrancar (por defecto 40 s), avisar que sigue vivo cada 5 s,
# ser eliminado tras 15 s sin avisar y actualizar la lista de servicios cada 5 s
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
