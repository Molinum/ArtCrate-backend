# Base de datos de ArtCrate: un solo MySQL con una base por servicio.
#   Levantar:  docker compose up -d
#   Apagar:    docker compose down          (los datos se conservan en el volumen)
#   Empezar de cero: docker compose down -v (borra el volumen y se recrean las bases)
services:
  mysql:
    image: mysql:8.4
    container_name: artcrate-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: artcrate
      MYSQL_PASSWORD: artcrate
      TZ: America/Santiago
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - artcrate-mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Consola web para ver las 6 bases (tablas, relaciones, datos) sin instalar nada.
  # http://localhost:8090 — entra directo como root (sin login) gracias a PMA_USER/PMA_PASSWORD.
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: artcrate-phpmyadmin
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  artcrate-mysql-data:
