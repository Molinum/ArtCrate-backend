# ===== gateway-service =====
# El front llama SOLO a http://localhost:8080. El gateway mira la ruta y reenvía la petición
# al servicio que corresponde, buscándolo por su nombre en Eureka (lb:// = "load balanced").
server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    # El balanceador de carga recuerda las direcciones de los servicios solo 5 s (por defecto 35 s)
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webflux:
          # ----- CORS global: es el ÚNICO lugar donde se configura (los servicios ya no lo hacen) -----
          globalcors:
            # Permite que las peticiones "preflight" (OPTIONS) las responda el gateway
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "http://localhost:*"
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"

          # ----- Rutas: si la dirección empieza con... se envía a... -----
          routes:
            - id: usuarios
              uri: lb://usuarios-service
              predicates:
                - Path=/api/usuarios/**
            - id: catalogo
              uri: lb://catalogo-service
              predicates:
                - Path=/api/categorias/**, /api/productos/**
            - id: inventario
              uri: lb://inventario-service
              predicates:
                - Path=/api/inventario/**
            - id: carrito
              uri: lb://carrito-service
              predicates:
                - Path=/api/carritos/**
            - id: pedidos
              uri: lb://pedidos-service
              predicates:
                - Path=/api/pedidos/**
            - id: pagos
              uri: lb://pagos-service
              predicates:
                - Path=/api/pagos/**

            # ----- Swagger de cada servicio (solo el JSON de OpenAPI, no la pantalla):
            # el gateway lo pide con un nombre distinto por servicio y lo reenvía a /v3/api-docs.
            # La pantalla de Swagger la pone el propio gateway (ver springdoc más abajo), así que
            # solo existe UNA vez y muestra las 6 specs en un selector. -----
            - id: usuarios-docs
              uri: lb://usuarios-service
              predicates:
                - Path=/docs/usuarios/v3/api-docs
              filters:
                - RewritePath=/docs/usuarios/v3/api-docs, /v3/api-docs
            - id: catalogo-docs
              uri: lb://catalogo-service
              predicates:
                - Path=/docs/catalogo/v3/api-docs
              filters:
                - RewritePath=/docs/catalogo/v3/api-docs, /v3/api-docs
            - id: inventario-docs
              uri: lb://inventario-service
              predicates:
                - Path=/docs/inventario/v3/api-docs
              filters:
                - RewritePath=/docs/inventario/v3/api-docs, /v3/api-docs
            - id: carrito-docs
              uri: lb://carrito-service
              predicates:
                - Path=/docs/carrito/v3/api-docs
              filters:
                - RewritePath=/docs/carrito/v3/api-docs, /v3/api-docs
            - id: pedidos-docs
              uri: lb://pedidos-service
              predicates:
                - Path=/docs/pedidos/v3/api-docs
              filters:
                - RewritePath=/docs/pedidos/v3/api-docs, /v3/api-docs
            - id: pagos-docs
              uri: lb://pagos-service
              predicates:
                - Path=/docs/pagos/v3/api-docs
              filters:
                - RewritePath=/docs/pagos/v3/api-docs, /v3/api-docs

# ----- Swagger agregado: una sola pantalla (http://localhost:8080/swagger-ui.html) con un
# selector para las 6 specs, cada una leída a través de las rutas /docs/<servicio>/v3/api-docs
# de arriba. "Probar" (Try it out) funciona porque cada servicio reporta su URL pública como
# http://localhost:8080 (ver server.forward-headers-strategy en cada application.properties),
# así que las peticiones de prueba van por las rutas /api/** normales, no directo al servicio. -----
springdoc:
  swagger-ui:
    urls:
      - name: usuarios
        url: /docs/usuarios/v3/api-docs
      - name: catalogo
        url: /docs/catalogo/v3/api-docs
      - name: inventario
        url: /docs/inventario/v3/api-docs
      - name: carrito
        url: /docs/carrito/v3/api-docs
      - name: pedidos
        url: /docs/pedidos/v3/api-docs
      - name: pagos
        url: /docs/pagos/v3/api-docs

# ----- Eureka: de aquí el gateway averigua dónde está cada servicio -----
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    # Ajustes de desarrollo: ver los servicios nuevos o caídos a los 5 s (por defecto 30 s)
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 5
  instance:
    # Se registra como "localhost": todo corre en la misma máquina, así que funciona siempre,
    # sin depender del nombre del equipo (hostname) ni de la red a la que estés conectado.
    hostname: localhost
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
