# ===== carrito-service =====
spring.application.name=carrito-service
server.port=8084

# ----- Base de datos MySQL en Docker (una por servicio; ver docker-compose.yml) -----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/carrito_db
spring.datasource.username=${DB_USER:artcrate}
spring.datasource.password=${DB_PASSWORD:artcrate}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# ----- Swagger: http://localhost:8084/swagger-ui.html -----
springdoc.swagger-ui.path=/swagger-ui.html


# ----- Timeouts de Feign: 5 segundos para conectar y 5 para leer la respuesta -----
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# ----- Eureka: el servicio se registra aquí para que los demás lo encuentren por su nombre -----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Se registra como "localhost": todos los servicios corren en la misma máquina, así que funciona
# siempre, sin depender del nombre del equipo (hostname) ni de la red a la que estés conectado.
eureka.instance.hostname=localhost
# Ajustes de desarrollo (más rápidos que los valores por defecto):
# registrarse a los 5 s de arrancar (por defecto 40 s), avisar que sigue vivo cada 5 s,
# ser eliminado tras 15 s sin avisar y actualizar la lista de servicios cada 5 s
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
# El balanceador de carga recuerda las direcciones de los servicios solo 5 s (por defecto 35 s)
spring.cloud.loadbalancer.cache.ttl=5s
