# ===== carrito-service =====
spring.application.name=carrito-service
server.port=8084

# ----- Base de datos H2 en archivo (una por servicio) -----
spring.datasource.url=jdbc:h2:file:./data/carrito-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola H2: http://localhost:8084/h2-console  (JDBC URL: jdbc:h2:file:./data/carrito-db)
spring.h2.console.enabled=true

# ----- Para cambiar a MySQL: comenta las líneas de H2 de arriba, agrega la dependencia
# ----- mysql-connector-j al pom.xml y descomenta estas líneas -----
#spring.datasource.url=jdbc:mysql://localhost:3306/carrito_db?createDatabaseIfNotExist=true
#spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=tu_clave
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ----- Swagger: http://localhost:8084/swagger-ui.html -----
springdoc.swagger-ui.path=/swagger-ui.html

# ----- URLs de los otros servicios (los usan los clientes Feign) -----
servicios.catalogo.url=http://localhost:8082
servicios.inventario.url=http://localhost:8083

# ----- Timeouts de Feign: 5 segundos para conectar y 5 para leer la respuesta -----
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
