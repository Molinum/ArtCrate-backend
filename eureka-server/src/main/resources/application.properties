# ===== eureka-server =====
spring.application.name=eureka-server
server.port=8761

# Este servidor ES el registro, así que no se registra en sí mismo ni descarga el registro de nadie
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# ----- Ajustes de desarrollo -----
# Sin "modo de autopreservación", un servicio que se apaga se elimina del registro pronto
# (con pocos servicios, Eureka entraría en autopreservación y los dejaría listados aunque estén caídos).
eureka.server.enable-self-preservation=false
# Cada cuántos milisegundos Eureka revisa y elimina los servicios que dejaron de avisar
eureka.server.eviction-interval-timer-in-ms=5000
